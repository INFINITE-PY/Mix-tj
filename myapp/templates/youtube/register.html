{% extends "youtube/base.html" %}

{% block title %}Регистрация — MIX{% endblock %}

{% block layout %}
<div class="auth-wrap">
    <div class="auth-card">
        <h2 style="text-align:center;">Создать <span style="color:var(--accent);">MIX</span> аккаунт</h2>
        <p class="auth-sub" style="text-align:center;">Присоединяйтесь к сообществу MIX.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>

        <div class="auth-links">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a><br><br>
            <a href="{% url 'index' %}"><i class="fa-solid fa-arrow-left"></i> На главную</a>
        </div>
    </div>
</div>
{% endblock %}
