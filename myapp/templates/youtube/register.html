<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .reg-card { background: #fff; padding: 30px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 340px; }
        .reg-card h2 { margin-bottom: 20px; font-size: 20px; color: #111; text-align: center; border-bottom: 2px solid #e50914; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #444; }
        .form-group input { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 3px; outline: none; }
        .helptext { font-size: 10px; color: #777; display: block; margin-top: 2px; }
        .errorlist { color: #e50914; font-size: 11px; margin-bottom: 8px; list-style: none; }
        .btn-submit { width: 100%; background: #e50914; color: #fff; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 3px; cursor: pointer; margin-top: 10px; }
        .login-link { display: block; text-align: center; margin-top: 15px; font-size: 13px; color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>

<div class="reg-card">
    <h2>Регистрация</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Зарегистрироваться</button>
    </form>
    <a href="{% url 'login' %}" class="login-link">Уже есть аккаунт? Войти</a>
</div>

</body>
</html>
