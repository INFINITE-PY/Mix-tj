{% extends "youtube/base.html" %}

{% block title %}Вход — MIX{% endblock %}

{% block layout %}
<div class="auth-wrap">
    <div class="auth-card">
        <h2 style="text-align:center;">Вход в <span style="color:var(--accent);">MIX</span></h2>
        <p class="auth-sub" style="text-align:center;">С возвращением! Продолжайте смотреть.</p>

        {% if form.errors %}
            <div class="alert-error"><i class="fa-solid fa-circle-exclamation"></i> Неверное имя пользователя или пароль.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="field">
                <label>Имя пользователя</label>
                <input type="text" name="username" placeholder="Ваш логин" required autocomplete="username">
            </div>

            <div class="field">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Ваш пароль" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-right-to-bracket"></i> Войти
            </button>
        </form>

        <div class="auth-links">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a><br><br>
            <a href="{% url 'index' %}"><i class="fa-solid fa-arrow-left"></i> На главную</a>
        </div>
    </div>
</div>
{% endblock %}
