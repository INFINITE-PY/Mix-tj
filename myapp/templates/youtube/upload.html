{% extends "youtube/base.html" %}

{% block title %}Загрузка видео — MIX{% endblock %}

{% block layout %}
<div class="auth-wrap">
    <div class="auth-card wide">
        <h2><i class="fa-solid fa-cloud-arrow-up" style="color:var(--accent)"></i> Загрузить новое видео</h2>
        <p class="auth-sub">Заполните форму и опубликуйте ролик на своей странице.</p>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="field">
                <label>Название видео *</label>
                <input type="text" name="title" placeholder="Введите название ролика" required>
            </div>

            <div class="field">
                <label>Категория</label>
                <select name="category">
                    <option value="">-- Выберите категорию --</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Длительность (например, 01:45:29)</label>
                <input type="text" name="duration" placeholder="00:00">
            </div>

            <div class="field">
                <label>Описание</label>
                <textarea name="description" placeholder="Расскажите о видео..."></textarea>
            </div>

            <div class="field">
                <label>Файл видео (.mp4, .avi) *</label>
                <input type="file" name="video" accept="video/*" required>
            </div>

            <div class="field">
                <label>Обложка / Превью (.jpg, .png)</label>
                <input type="file" name="thumbnail" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-rocket"></i> Опубликовать
            </button>
        </form>

        <div class="auth-links">
            <a href="{% url 'index' %}"><i class="fa-solid fa-arrow-left"></i> Вернуться на главную</a>
        </div>
    </div>
</div>
{% endblock %}
